trigger:
  - production   # change to 'main' or your real branch if needed

pr: none

pool:
  name: 'IISPool'   # must match your self-hosted agent pool name exactly

variables:
  iisDeployPath: 'C:\inetpub\vhosts\iponigeria.com\iponigeria.com'
  nextOutputDir: 'out'

stages:
  - stage: Build
    displayName: 'Build Next.js frontend'
    jobs:
      - job: BuildJob
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '22.x'

          - script: npm install
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build Next.js app (static export -> out/)'

          - task: PowerShell@2
            displayName: 'Deploy to IIS folder'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Removing old files from $(iisDeployPath)..."
                Remove-Item -Path '$(iisDeployPath)\*' -Recurse -Force -ErrorAction SilentlyContinue

                Write-Host "Copying new build from $(nextOutputDir)..."
                Copy-Item -Path "$(System.DefaultWorkingDirectory)\$(nextOutputDir)\*" `
                          -Destination "$(iisDeployPath)" `
                          -Recurse -Force

                Write-Host "Deployment complete."
